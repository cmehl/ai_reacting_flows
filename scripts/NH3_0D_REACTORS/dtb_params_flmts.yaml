mech_file: ../../data/chemical_mechanisms/mech_nh3_noArHe.yaml
pv_species:
- H2O
fuel:
- NH3
results_folder_suffix: NH3_1ATM
dtb_file: solutions.h5
pressure: 101325.0
time_step:  1.0e-6
include_zerod: True
include_oned_prem: False
include_oned_diff: False
zerod_params:
  phi_bounds:
  - 0.6
  - 1.3
  T0_bounds:
  - 1800.0
  - 2000.0
  n_samples: 200
  max_sim_time: 1.0e-2
  T_eq_tolerance: 2.0     # [K] end of each reactor when T is within this of equilibrium and no longer changing (default: 0.5 % criterion)
  dT_tolerance: 1.0e-3    # [K] and when T changes by less than this over one time_step (default: T_eq_tolerance)
  solve_mode: "dt_cfd"
  skip_initial_state: true   # Initial mixture of each reactor not stored (its step is an outlier): use cvode_initial_steps: 1 in the tests
oned_prem_params:
  phi_bounds:
    - 0.6
    - 1.3
  T0_bounds:
    - 300.0
    - 500.0
  n_samples: 3
oned_diff_params:
  strain_bounds:
    - 0.0
    - 1000.0
  T0_bounds:
    - 300.0
    - 500.0
  n_samples: 3
  width: 0.02
  T_fuel: 300.0           # [K] fuel inlet (T0_bounds: air inlet)
augment_dataset: False
scatter_plot_variables: [Temperature, H2O]   # [x, y] of the scatter plot of the database
# For rollout database generation (generate_multi_dt.py)
T_threshold: 600.0
time_step_type: rollout
rollout_dt: 1.0e-06
rollout_steps: 3
new_file_name: solutions_rollout.h5
