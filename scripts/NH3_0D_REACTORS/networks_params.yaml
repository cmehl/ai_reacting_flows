database_path: FLAMELETS_DTB_NH3_1ATM/dtb_nh3_0D_2clusters
model_name_suffix: NH3_0D_2CLUSTERS
new_model_folder: true
networks_types:
- MLP
- MLP
networks_def:
- cluster0
- cluster1
clusters:
  cluster0:
    nb_units_in_layers_list:
    - 150
    - 150
    - 100
    layers_activation_list:
    - GeLU
    - GeLU
    - GeLU
    - Id
    layers_type:
    - dense
    - dense
    - dense
    - dense
  cluster1:
    nb_units_in_layers_list:
    - 150
    - 150
    - 100
    layers_activation_list:
    - GeLU
    - GeLU
    - GeLU
    - Id
    layers_type:
    - dense
    - dense
    - dense
    - dense
learning:
  initial_learning_rate: 0.01
  batch_size: 2048
  epochs_list:
  - 1500
  - 1500
  decay_rate: 0.995
  loss_weighting_p: 0.0        # Weights (Omega + eps)^(-p) of the points, Omega^2 = sum_k (omega_k / sigma_k)^2: 0 none, 1 same gradient, 2 same loss for the same relative error
  loss_weighting_eps: 1.0e-02  # Floor of Omega [-] (units of sigma_k), about the error the network can reach: see ERROR_VS_OMEGA in the training log
  loss_weighting_q: 0.0        # Density factor N_bin^(-q) of the weights (bins of log10(Omega)): 1 as undersample_Omega without discarding points
  loss_weighting_min_count: 100 # Floor of N_bin, bounds the weights of rare bins
  loss_weighting_per_species: false # true: one weight per point and per species, from |omega_k| / sigma_k (larger eps)
  omega_diagnostics_epochs: [300, 750, 1200]   # Epochs (from 0) of the plots per decade of Omega in training/cluster_<i>/ (also after training)
