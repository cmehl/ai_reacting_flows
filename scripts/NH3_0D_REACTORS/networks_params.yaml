database_path: FLAMELETS_DTB_NH3_1ATM/dtb_nh3_0D_omegas
model_name_suffix: NH3_0D_WEIGHTED
new_model_folder: true
networks_types:
- MLP
networks_def:
- cluster0
clusters:
  cluster0:
    nb_units_in_layers_list:
    - 150
    - 150
    - 100
    layers_activation_list:
    - GeLU
    - GeLU
    - GeLU
    - Id
    layers_type:
    - dense
    - dense
    - dense
    - dense
learning:
  initial_learning_rate: 0.01
  batch_size: 2048
  epochs_list:
  - 1500
  decay_rate: 0.995
  loss_weighting_p: 1.0        # Weights (Omega + eps)^(-p) of the points, Omega^2 = sum_k (omega_k / sigma_k)^2: 0 none, 1 same gradient, 2 same loss for the same relative error
  loss_weighting_eps: 1.0e-02  # Floor of Omega [-] (units of sigma_k), about the error the network can reach
