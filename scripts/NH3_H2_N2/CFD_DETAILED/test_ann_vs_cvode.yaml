# CSV-slice variant (exact ParaView cuts). filename uses a positive
# magnitude, center is the actual signed Z coordinate -- domain Z in
# [-0.3775, -0.0005]. models_folder/output_file below assume the
# mlp_percluster variant was just trained (python ann_model_learning.py
# mlp_percluster) -- edit both to match whichever variant/suffix you
# actually want to test. mask_cvode_below_threshold: true forces CVODE
# itself to identity below T_threshold on both sides, removing the
# masking artifact that otherwise inflates RMSE when comparing a
# T_threshold-masked ANN against an unmasked CVODE reference.
models_folder: MODEL_DETAILED_HR_dt5e7_1D_mlp_percluster
time_step: 5.0e-07
T_threshold: 800.0
mask_cvode_below_threshold: true
output_file: testing_results_DETAILED_HR_dt5e7_1D_mlp_percluster_maskedCVODE800_csv.h5
csv_slices:
  - {file: DATA/testing/Slice_Z_0.3_2.95s.csv, axis: Z, center: -0.30}
  - {file: DATA/testing/Slice_Z_0.15_2.95s.csv, axis: Z, center: -0.15}
  - {file: DATA/testing/Slice_Z_0.11_2.95s.csv, axis: Z, center: -0.11}
  - {file: DATA/testing/Slice_Z_0.10_2.95s.csv, axis: Z, center: -0.10}
  - {file: DATA/testing/Slice_Z_0.09_2.95s.csv, axis: Z, center: -0.09}
  - {file: DATA/testing/Slice_Z_0.08_2.95s.csv, axis: Z, center: -0.08}
  - {file: DATA/testing/Slice_Z_0.065_2.95s.csv, axis: Z, center: -0.065}
  - {file: DATA/testing/Slice_Z_0.05_2.95s.csv, axis: Z, center: -0.05}
  - {file: DATA/testing/Slice_X_2.95s.csv, axis: X, center: 0.0}
