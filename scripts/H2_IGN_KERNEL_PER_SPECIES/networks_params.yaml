database_path: STOCH_DTB_H2_POF_2023/dtb_resampled
model_name_suffix: H2_PER_SPECIES
new_model_folder: true
networks_types:          # One MLP per species (8 species without N2), each predicting one output
- PerSpeciesMLP
- PerSpeciesMLP
networks_def:
- cluster0
- cluster1
clusters:
  cluster0:                # Network of each species (H2_IGN_KERNEL: one network of 2 x 20 for all species)
    nb_units_in_layers_list:
    - 10
    - 10
    layers_activation_list:
    - tanh
    - tanh
    - Id
    layers_type:
    - dense
    - dense
    - dense
  cluster1:                # Network of each species (H2_IGN_KERNEL: one network of 2 x 40 for all species)
    nb_units_in_layers_list:
    - 20
    - 20
    layers_activation_list:
    - tanh
    - tanh
    - Id
    layers_type:
    - dense
    - dense
    - dense
learning:
  initial_learning_rate: 0.001
  batch_size: 2048
  epochs_list:
  - 500
  - 500
  decay_rate: 0.9991
