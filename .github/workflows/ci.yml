name : Continuous Integration

on:
  push:
    branches:
      - master
      - CI_test
  pull_request:
    branches:
      - master

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install MPI
      uses: mpi4py/setup-mpi@v1
      with:
        mpi: openmpi

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --no-cache-dir -e .

    - name: Check MPI with 2 ranks
      run: |
        mpiexec --version
        mpiexec -n 2 python -c "from mpi4py import MPI; print('rank', MPI.COMM_WORLD.Get_rank(), 'of', MPI.COMM_WORLD.Get_size())"

    - name: Run tests
      run: |
        pytest tests/
